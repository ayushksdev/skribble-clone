services:
  # Backend Web Service (Node.js + Express + Socket.IO)
  - type: web
    name: skribbl-backend
    env: node
    plan: free
    rootDir: server
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    envVars:
      - key: PORT
        value: 10000
      - key: NODE_ENV
        value: production
      - key: CLIENT_URL
        value: "*"

  # Frontend Static Site (React + Vite + Tailwind CSS)
  - type: static
    name: skribbl-frontend
    rootDir: client
    buildCommand: npm install --include=dev && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_BACKEND_URL
        fromService:
          type: web
          name: skribbl-backend
          property: host
